<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1d2433;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  // Logical playfield. The canvas is scaled to fit the window.
  const W = 400;
  const H = 600;
  const GROUND_H = 80;
  const GROUND_Y = H - GROUND_H;

  const BIRD_X = 110;
  const BIRD_DRAW_R = 15; // radius used for drawing
  const BIRD_HIT_R = 10;  // smaller collision box so near misses look fair
  const GRAVITY = 1400;   // px/s^2
  const FLAP_VY = -430;   // px/s, velocity set on each flap
  const MAX_FALL_VY = 650;

  const PIPE_W = 62;
  const PIPE_GAP = 150;
  const PIPE_SPACING = 230; // px between consecutive pipes
  const PIPE_SPEED = 150;   // px/s
  const PIPE_MARGIN = 60;   // min distance from gap edge to ceiling/ground
  const CAP_H = 26;
  const TILE = 24;          // ground stripe period

  const RESTART_DELAY = 500; // ms; ignores input right after death

  const PIPE_FILL = '#73bf2e';
  const PIPE_SHADE = '#558b2f';
  const PIPE_EDGE = '#2e5a12';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let state, bird, pipes, score, groundOffset, wingT, bobT, overAt;

  function reset() {
    state = 'ready';
    bird = { y: H * 0.45, vy: 0, angle: 0 };
    pipes = [];
    score = 0;
    groundOffset = 0;
    wingT = 0;
    bobT = 0;
    overAt = 0;
  }

  function flap() {
    bird.vy = FLAP_VY;
  }

  function begin() {
    state = 'playing';
    flap();
  }

  function die() {
    if (state !== 'playing') return;
    state = 'over';
    overAt = performance.now();
  }

  function spawnPipe() {
    const gapTop = PIPE_MARGIN + Math.random() * (GROUND_Y - PIPE_GAP - 2 * PIPE_MARGIN);
    pipes.push({ x: W, gapTop, passed: false });
  }

  function pipeHit(p) {
    const left = p.x;
    const right = p.x + PIPE_W;
    if (BIRD_X + BIRD_HIT_R <= left || BIRD_X - BIRD_HIT_R >= right) return false;
    return bird.y - BIRD_HIT_R < p.gapTop || bird.y + BIRD_HIT_R > p.gapTop + PIPE_GAP;
  }

  function update(dt) {
    if (state !== 'over') wingT += dt;

    if (state === 'ready') {
      bobT += dt;
      bird.y = H * 0.45 + Math.sin(bobT * 4) * 8;
      return;
    }

    // Bird physics. Keeps running after death so the bird falls to the ground.
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL_VY);
    bird.y += bird.vy * dt;
    bird.angle = Math.max(-0.45, Math.min(1.2, bird.vy / 400));

    if (bird.y - BIRD_DRAW_R < 0) { // ceiling: clamp, not fatal
      bird.y = BIRD_DRAW_R;
      bird.vy = 0;
    }
    if (bird.y + BIRD_HIT_R >= GROUND_Y) { // ground: fatal
      bird.y = GROUND_Y - BIRD_HIT_R;
      bird.vy = 0;
      die();
    }

    if (state !== 'playing') return; // pipes freeze on death

    groundOffset = (groundOffset + PIPE_SPEED * dt) % TILE;
    for (const p of pipes) p.x -= PIPE_SPEED * dt;

    const last = pipes[pipes.length - 1];
    if (!last || W - last.x >= PIPE_SPACING) spawnPipe();
    while (pipes.length && pipes[0].x + PIPE_W < 0) pipes.shift();

    for (const p of pipes) {
      if (pipeHit(p)) {
        die();
        return;
      }
      if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_HIT_R) {
        p.passed = true;
        score++;
      }
    }
  }

  function onPress() {
    if (state === 'ready') {
      begin();
    } else if (state === 'playing') {
      flap();
    } else if (state === 'over' && performance.now() - overAt >= RESTART_DELAY) {
      reset();
      begin();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    if (!e.repeat) onPress();
  });

  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    onPress();
  });

  function resize() {
    const ratio = window.devicePixelRatio || 1;
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * ratio);
    canvas.height = Math.round(H * scale * ratio);
  }
  window.addEventListener('resize', resize);

  function drawText(str, x, y, size, fill) {
    ctx.font = `bold ${size}px Arial, Helvetica, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size / 8);
    ctx.strokeStyle = '#3b2b1c';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, '#4ec0ca');
    g.addColorStop(1, '#c9f0f4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function pipeBody(x, y, w, h) {
    ctx.fillStyle = PIPE_FILL;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = PIPE_SHADE;
    ctx.fillRect(x + w - 8, y, 8, h);
    ctx.strokeStyle = PIPE_EDGE;
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  }

  function drawPipes() {
    for (const p of pipes) {
      const gapBottom = p.gapTop + PIPE_GAP;
      pipeBody(p.x, 0, PIPE_W, p.gapTop - CAP_H);                              // top body
      pipeBody(p.x - 4, p.gapTop - CAP_H, PIPE_W + 8, CAP_H);                  // top cap
      pipeBody(p.x - 4, gapBottom, PIPE_W + 8, CAP_H);                         // bottom cap
      pipeBody(p.x, gapBottom + CAP_H, PIPE_W, GROUND_Y - gapBottom - CAP_H);  // bottom body
    }
  }

  function drawBird() {
    const flapPhase = Math.sin(wingT * 20);
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.angle);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#3b2b1c';

    // body
    ctx.fillStyle = '#f7d51d';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_DRAW_R + 2, BIRD_DRAW_R, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // wing
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.ellipse(-5, 3 + flapPhase * 4, 9, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(8, -5, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // beak
    ctx.fillStyle = '#f08a24';
    ctx.beginPath();
    ctx.moveTo(BIRD_DRAW_R - 3, -3);
    ctx.lineTo(BIRD_DRAW_R + 8, 2);
    ctx.lineTo(BIRD_DRAW_R - 3, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, GROUND_Y, W, 18);
    ctx.fillStyle = '#5a9e1f';
    for (let x = -groundOffset; x < W; x += TILE) {
      ctx.fillRect(x, GROUND_Y, TILE / 2, 18);
    }
    ctx.fillStyle = '#543847';
    ctx.fillRect(0, GROUND_Y, W, 2);
  }

  function drawHud() {
    if (state === 'ready') {
      drawText('Flappy Bird', W / 2, H * 0.22, 52, '#ffffff');
      drawText('Tap, click or press Space', W / 2, H * 0.22 + 50, 18, '#ffffff');
      return;
    }

    drawText(String(score), W / 2, 70, 56, '#ffffff');

    if (state === 'over') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.fillRect(0, 0, W, GROUND_Y);

      const pw = 280;
      const ph = 190;
      const px = (W - pw) / 2;
      const py = H * 0.5 - ph / 2;
      ctx.fillStyle = '#ded895';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#543847';
      ctx.lineWidth = 4;
      ctx.strokeRect(px + 2, py + 2, pw - 4, ph - 4);

      drawText('Game Over', W / 2, py + 50, 40, '#e65a2e');
      drawText('Score: ' + score, W / 2, py + 105, 28, '#ffffff');
      if (performance.now() - overAt >= RESTART_DELAY) {
        drawText('Tap, click or press Space to retry', W / 2, py + 152, 15, '#ffffff');
      }
    }
  }

  function draw() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    drawSky();
    drawPipes();
    drawBird();
    drawGround();
    drawHud();
  }

  let last = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
