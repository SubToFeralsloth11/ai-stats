<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Bird</title>
<style>
html,body{margin:0;height:100%;background:#222;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
canvas{background:#70c5ce;max-height:100vh;max-width:100vw;display:block}
</style>
</head>
<body>
<canvas id="c" width="400" height="600"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400,H=600,GROUND=540,PW=60,GAP=150,SPEED=2.5,GRAV=0.45,FLAP=-7.5,SPACING=220;
let bird,pipes,score,best=0,state,frame;
function reset(){bird={x:100,y:H/2,vy:0,r:14};pipes=[];score=0;frame=0;state='ready';}
function flap(){
  if(state==='over'){reset();return;}
  if(state==='ready')state='play';
  bird.vy=FLAP;
}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)flap();}});
cv.addEventListener('mousedown',e=>{e.preventDefault();flap();});
cv.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
function addPipe(){const min=60,max=GROUND-GAP-60;pipes.push({x:W,top:min+Math.random()*(max-min),passed:false});}
function hit(p){
  const cx=Math.max(p.x,Math.min(bird.x,p.x+PW));
  for(const [y0,y1] of [[0,p.top],[p.top+GAP,GROUND]]){
    const cy=Math.max(y0,Math.min(bird.y,y1));
    if((bird.x-cx)**2+(bird.y-cy)**2<bird.r*bird.r)return true;
  }
  return false;
}
function update(){
  frame++;
  if(state==='ready'){bird.y=H/2+Math.sin(frame/10)*6;return;}
  if(state==='play'){
    bird.vy+=GRAV;bird.y+=bird.vy;
    if(bird.y<bird.r){bird.y=bird.r;bird.vy=0;}
    if(!pipes.length||pipes[pipes.length-1].x<W-SPACING)addPipe();
    for(const p of pipes){
      p.x-=SPEED;
      if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;}
      if(hit(p))end();
    }
    pipes=pipes.filter(p=>p.x+PW>0);
    if(bird.y+bird.r>=GROUND){bird.y=GROUND-bird.r;end();}
  }else if(state==='over'&&bird.y+bird.r<GROUND){
    bird.vy+=GRAV;bird.y=Math.min(bird.y+bird.vy,GROUND-bird.r);
  }
}
function end(){if(state!=='play')return;state='over';best=Math.max(best,score);}
function text(s,x,y,size){ctx.font='bold '+size+'px Arial';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(s,x,y);ctx.fillStyle='#fff';ctx.fillText(s,x,y);}
function draw(){
  ctx.fillStyle='#70c5ce';ctx.fillRect(0,0,W,H);
  for(const p of pipes){
    ctx.fillStyle='#5cbf2a';ctx.strokeStyle='#2d6e12';ctx.lineWidth=3;
    ctx.fillRect(p.x,0,PW,p.top);ctx.strokeRect(p.x,-3,PW,p.top+3);
    ctx.fillRect(p.x-4,p.top-24,PW+8,24);ctx.strokeRect(p.x-4,p.top-24,PW+8,24);
    const b=p.top+GAP;
    ctx.fillRect(p.x,b,PW,GROUND-b);ctx.strokeRect(p.x,b,PW,GROUND-b);
    ctx.fillRect(p.x-4,b,PW+8,24);ctx.strokeRect(p.x-4,b,PW+8,24);
  }
  ctx.fillStyle='#ded895';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#5cbf2a';ctx.fillRect(0,GROUND,W,12);
  ctx.save();ctx.translate(bird.x,bird.y);
  ctx.rotate(state==='ready'?0:Math.max(-0.5,Math.min(1.3,bird.vy*0.08)));
  ctx.fillStyle='#f7d51d';ctx.strokeStyle='#000';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,5,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(8,-5,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f57c00';ctx.beginPath();ctx.moveTo(10,1);ctx.lineTo(22,4);ctx.lineTo(10,8);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff8c0';ctx.beginPath();ctx.ellipse(-6,3,7,4,0,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
  if(state!=='ready')text(score,W/2,80,48);
  if(state==='ready'){text('Flappy Bird',W/2,180,44);text('Space / Click / Tap to flap',W/2,380,20);}
  if(state==='over'){text('Game Over',W/2,220,48);text('Score: '+score+'   Best: '+best,W/2,280,24);text('Space / Click / Tap to restart',W/2,330,20);}
}
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();acc-=1000/60;}
  draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
