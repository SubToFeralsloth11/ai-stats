<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #70c5ce; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
canvas { display: block; background: #70c5ce; }
#ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 48px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; }
#msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 28px; text-align: center; text-shadow: 2px 2px 0 #000; pointer-events: none; display: none; }
#msg.show { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">0</div>
<div id="msg"></div>
<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const ui = document.getElementById('ui');
const msg = document.getElementById('msg');

const GRAVITY = 0.45;
const FLAP = -9;
const PIPE_SPEED = 3;
const PIPE_GAP = 150;
const PIPE_FREQ = 1500;
const BIRD_RADIUS = 14;

let width, height, bird, pipes, score, running, lastPipe, frame;

function resize() {
  width = Math.min(window.innerWidth, 480);
  height = Math.min(window.innerHeight, 640);
  cvs.width = width;
  cvs.height = height;
}
window.addEventListener('resize', resize);
resize();

function reset() {
  bird = { x: width * 0.25, y: height / 2, vy: 0 };
  pipes = [];
  score = 0;
  running = true;
  lastPipe = 0;
  frame = 0;
  ui.textContent = '0';
  msg.classList.remove('show');
}

function flap() {
  if (!running) return;
  bird.vy = FLAP;
}

function spawnPipe() {
  const minY = 60;
  const maxY = height - 60 - PIPE_GAP;
  const gapY = minY + Math.random() * (maxY - minY);
  pipes.push({ x: width, gapY, passed: false });
}

function update(dt) {
  if (!running) return;

  bird.vy += GRAVITY;
  bird.y += bird.vy;

  if (bird.y + BIRD_RADIUS >= height || bird.y - BIRD_RADIUS <= 0) {
    gameOver();
    return;
  }

  frame += dt;
  if (frame - lastPipe >= PIPE_FREQ) {
    spawnPipe();
    lastPipe = frame;
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED;

    const birdLeft = bird.x - BIRD_RADIUS;
    const birdRight = bird.x + BIRD_RADIUS;
    const birdTop = bird.y - BIRD_RADIUS;
    const birdBottom = bird.y + BIRD_RADIUS;
    const pipeLeft = p.x;
    const pipeRight = p.x + 60;

    if (birdRight > pipeLeft && birdLeft < pipeRight) {
      if (birdTop < p.gapY || birdBottom > p.gapY + PIPE_GAP) {
        gameOver();
        return;
      }
    }

    if (!p.passed && birdLeft > pipeRight) {
      p.passed = true;
      score++;
      ui.textContent = score;
    }

    if (p.x + 60 < 0) pipes.splice(i, 1);
  }
}

function gameOver() {
  running = false;
  msg.innerHTML = `Game Over<br>Score: ${score}<br><small>Click / Space / Tap to restart</small>`;
  msg.classList.add('show');
}

function draw() {
  ctx.clearRect(0, 0, width, height);

  ctx.fillStyle = '#5c9e2e';
  for (const p of pipes) {
    ctx.fillRect(p.x, 0, 60, p.gapY);
    ctx.fillRect(p.x, p.gapY + PIPE_GAP, 60, height - p.gapY - PIPE_GAP);
    ctx.fillStyle = '#4a8626';
    ctx.fillRect(p.x - 4, 0, 68, p.gapY);
    ctx.fillRect(p.x - 4, p.gapY + PIPE_GAP, 68, height - p.gapY - PIPE_GAP);
    ctx.fillStyle = '#5c9e2e';
  }

  ctx.fillStyle = '#f9d423';
  ctx.beginPath();
  ctx.arc(bird.x, bird.y, BIRD_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e6c000';
  ctx.beginPath();
  ctx.arc(bird.x + 4, bird.y - 3, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(bird.x + 7, bird.y - 2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#e6b800';
  ctx.fillRect(0, height - 20, width, 20);
  ctx.fillStyle = '#d4a800';
  ctx.fillRect(0, height - 20, width, 4);
}

function loop(ts) {
  const dt = ts - (loop.last || ts);
  loop.last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (!running) reset(); else flap(); } });
cvs.addEventListener('mousedown', () => { if (!running) reset(); else flap(); });
cvs.addEventListener('touchstart', e => { e.preventDefault(); if (!running) reset(); else flap(); }, { passive: false });

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
