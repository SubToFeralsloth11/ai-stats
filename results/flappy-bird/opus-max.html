<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #1d2b31;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    cursor: pointer;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Flappy Bird. Press Space, click or tap to flap."></canvas>
<script>
(() => {
  'use strict';

  // ---------- Tuning (logical pixels, seconds) ----------
  const W = 360, H = 640;            // logical playfield, scaled to fit the window
  const GROUND_Y = 540;              // top edge of the ground
  const GRAVITY = 1650;              // px/s^2
  const FLAP_VELOCITY = 470;         // upward speed right after a flap, px/s
  const MAX_FALL = 700;              // terminal fall speed, px/s
  const CEILING = 14;                // the bird cannot rise above this y (not lethal)

  const BIRD_X = 100;
  const BIRD_SCALE = 1.2;            // sprite drawing scale
  const HIT_RX = 17, HIT_RY = 12;    // elliptical hitbox radii
  const READY_Y = 290;

  const PIPE_W = 64;
  const PIPE_GAP = 145;
  const PIPE_SPACING = 210;          // left edge to left edge of consecutive pipes
  const PIPE_SPEED = 140;            // px/s; the ground scrolls at the same speed
  const CAP_H = 24, CAP_OVER = 4;    // pipe lip height and overhang per side
  const GAP_MARGIN = 60;             // min distance from the gap to the top and to the ground
  const SPAWN_X = W + 60;            // pipes are created off-screen at this x

  const RESTART_DELAY = 0.6;         // seconds after landing before input restarts
  const MAX_STEP = 1 / 120;          // physics sub-step
  const ROT_PER_SPEED = (Math.PI / 2 + 0.4) / (0.75 * MAX_FALL);

  const OUTLINE = '#3b2a30';
  const FONT = '"Trebuchet MS", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  const TAU = Math.PI * 2;
  const BEST_KEY = 'flappy-best';

  // ---------- Canvas & scaling ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const fit = Math.min(window.innerWidth / W, window.innerHeight / H);
    const cssW = Math.max(1, Math.floor(W * fit));
    const cssH = Math.max(1, Math.floor(H * fit));
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Scenery: generated once, tiled horizontally with parallax ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const CLOUD_TW = 420, CITY_TW = 390, BUSH_TW = 330;   // tile widths
  const CLOUD_SPEED = 10, CITY_SPEED = 24, BUSH_SPEED = 55;
  const CLOUD_BASE = 425, BUSH_BASE = 514;
  const STRIPE = 24;                                    // ground stripe period

  const clouds = [];
  for (let x = 0; x < CLOUD_TW; x += rand(20, 46)) {
    clouds.push({ x, y: CLOUD_BASE + rand(-6, 10), r: rand(16, 42) });
  }

  const buildings = [];
  const cityWindows = [];                               // flat [x, y, x, y, ...]
  for (let x = 0; x < CITY_TW;) {
    const w = Math.round(rand(22, 46));
    const h = Math.round(rand(46, 104));
    buildings.push({ x, w, h });
    for (let wy = GROUND_Y - h + 6; wy < GROUND_Y - 12; wy += 9) {
      for (let wx = x + 4; wx <= x + w - 7; wx += 7) {
        if (Math.random() < 0.55) cityWindows.push(wx, wy);
      }
    }
    x += w + Math.round(rand(-2, 7));
  }

  const bushes = [];
  for (let x = 0; x < BUSH_TW; x += rand(14, 30)) {
    bushes.push({ x, y: BUSH_BASE + rand(-2, 8), r: rand(12, 24) });
  }

  const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  skyGrad.addColorStop(0, '#3eb4c7');
  skyGrad.addColorStop(1, '#a3e2e8');

  // Gradients are applied after ctx.translate(pipe.x, 0), so they are defined relative to the pipe.
  function pipeGradient(x0, x1) {
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#477f22');
    g.addColorStop(0.12, '#7fc544');
    g.addColorStop(0.3, '#b6ec78');
    g.addColorStop(0.55, '#86cf4b');
    g.addColorStop(0.85, '#5a9f30');
    g.addColorStop(1, '#3d7020');
    return g;
  }
  const bodyGrad = pipeGradient(0, PIPE_W);
  const capGrad = pipeGradient(-CAP_OVER, PIPE_W + CAP_OVER);

  // ---------- Game state ----------
  const bird = { y: READY_Y, vy: 0, rot: 0, anim: 0 };
  const pipes = [];                  // { x, gapTop, scored }
  let state;                         // 'ready' | 'playing' | 'over'
  let score, newBest, grounded, overTime, flash, scorePop;
  let best = loadBest();
  let time = 0;
  let groundOff = 0, cloudOff = 0, cityOff = 0, bushOff = 0;

  function loadBest() {
    try {
      return Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0);
    } catch (e) {
      return 0;
    }
  }

  function saveBest() {
    try {
      localStorage.setItem(BEST_KEY, String(best));
    } catch (e) {
      // Storage unavailable (private mode, sandboxed file://): best score stays in memory only.
    }
  }

  function reset() {
    state = 'ready';
    bird.y = READY_Y;
    bird.vy = 0;
    bird.rot = 0;
    bird.anim = 0;
    pipes.length = 0;
    score = 0;
    newBest = false;
    grounded = false;
    overTime = 0;
    flash = 0;
    scorePop = 0;
  }

  function flap() {
    bird.vy = -FLAP_VELOCITY;
  }

  function die() {
    state = 'over';
    flash = 0.85;
    overTime = 0;
    if (bird.vy < 0) bird.vy = 0;
    if (score > best) {
      best = score;
      newBest = true;
      saveBest();
    }
  }

  function press() {
    if (state === 'ready') {
      state = 'playing';
      flap();
    } else if (state === 'playing') {
      flap();
    } else if (grounded && overTime >= RESTART_DELAY) {
      reset();
    }
  }

  function spawnPipe(x) {
    const minTop = GAP_MARGIN;
    const maxTop = GROUND_Y - GAP_MARGIN - PIPE_GAP;
    pipes.push({ x, gapTop: Math.round(rand(minTop, maxTop)), scored: false });
  }

  // Bird hitbox (axis-aligned ellipse) vs rectangle: scale space so the ellipse becomes a unit circle.
  function hitRect(x, y, w, h) {
    const nx = Math.max(x, Math.min(BIRD_X, x + w));
    const ny = Math.max(y, Math.min(bird.y, y + h));
    const dx = (BIRD_X - nx) / HIT_RX;
    const dy = (bird.y - ny) / HIT_RY;
    return dx * dx + dy * dy < 1;
  }

  function hitPipe(p) {
    const capX = p.x - CAP_OVER;
    const capW = PIPE_W + CAP_OVER * 2;
    if (BIRD_X + HIT_RX <= capX || BIRD_X - HIT_RX >= capX + capW) return false;
    const bottom = p.gapTop + PIPE_GAP;
    return hitRect(p.x, -H, PIPE_W, p.gapTop - CAP_H + H) ||  // upper body, extends above the screen
      hitRect(capX, p.gapTop - CAP_H, capW, CAP_H) ||          // upper lip
      hitRect(capX, bottom, capW, CAP_H) ||                    // lower lip
      hitRect(p.x, bottom + CAP_H, PIPE_W, H);                 // lower body
  }

  // ---------- Simulation ----------
  function update(dt) {
    time += dt;
    flash = Math.max(0, flash - dt * 3);
    scorePop = Math.max(0, scorePop - dt * 6);

    if (state !== 'over') {
      groundOff = (groundOff + PIPE_SPEED * dt) % STRIPE;
      cloudOff = (cloudOff + CLOUD_SPEED * dt) % CLOUD_TW;
      cityOff = (cityOff + CITY_SPEED * dt) % CITY_TW;
      bushOff = (bushOff + BUSH_SPEED * dt) % BUSH_TW;
      bird.anim += dt;
    }

    if (state === 'ready') {
      bird.y = READY_Y + Math.sin(time * 7) * 6;
      return;
    }

    // Bird physics run while playing and, after a crash, until the bird lands.
    if (!grounded) {
      bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
      bird.y += bird.vy * dt;
      if (bird.y < CEILING) {
        bird.y = CEILING;
        if (bird.vy < 0) bird.vy = 0;
      }
      // Nose up while rising, dive progressively while falling, straight down once dead.
      const target = state === 'over' ? Math.PI / 2
        : bird.vy <= 0 ? -0.4
        : Math.min(Math.PI / 2, -0.4 + bird.vy * ROT_PER_SPEED);
      const rate = target < bird.rot ? 18 : (state === 'over' ? 9 : 5);
      bird.rot += (target - bird.rot) * Math.min(1, rate * dt);

      if (bird.y >= GROUND_Y - HIT_RY) {
        bird.y = GROUND_Y - HIT_RY;
        grounded = true;
        if (state === 'playing') die();
      }
    }

    if (state === 'playing') {
      const dx = PIPE_SPEED * dt;
      for (const p of pipes) p.x -= dx;
      while (pipes.length && pipes[0].x + PIPE_W + CAP_OVER < 0) pipes.shift();
      const newest = pipes[pipes.length - 1];
      if (!newest) spawnPipe(SPAWN_X);
      else if (newest.x <= SPAWN_X - PIPE_SPACING) spawnPipe(newest.x + PIPE_SPACING);

      for (const p of pipes) {
        if (hitPipe(p)) {
          die();
          return;
        }
      }
      for (const p of pipes) {
        if (!p.scored && p.x + PIPE_W + CAP_OVER < BIRD_X) {
          p.scored = true;
          score++;
          scorePop = 1;
        }
      }
    } else if (grounded) {
      overTime += dt;
    }
  }

  // ---------- Rendering ----------
  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawText(str, x, y, size, fill, lineWidth) {
    ctx.font = 'bold ' + size + 'px ' + FONT;
    ctx.lineWidth = lineWidth;
    ctx.strokeStyle = OUTLINE;
    ctx.strokeText(str, x, y, W - 24);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y, W - 24);
  }

  // Calls addShapes once per visible tile copy; the extra copy on each side covers overhanging shapes.
  function forTiles(offset, tileW, addShapes) {
    for (let x0 = -offset - tileW; x0 < W + 64; x0 += tileW) addShapes(x0);
  }

  function addClouds(x0) {
    for (const c of clouds) {
      ctx.moveTo(x0 + c.x + c.r, c.y);
      ctx.arc(x0 + c.x, c.y, c.r, 0, TAU);
    }
  }

  function addBuildings(x0) {
    for (const b of buildings) ctx.rect(x0 + b.x, GROUND_Y - b.h, b.w, b.h);
  }

  function addWindows(x0) {
    for (let i = 0; i < cityWindows.length; i += 2) ctx.rect(x0 + cityWindows[i], cityWindows[i + 1], 3, 4);
  }

  function addBushes(x0) {
    for (const b of bushes) {
      ctx.moveTo(x0 + b.x + b.r, b.y);
      ctx.arc(x0 + b.x, b.y, b.r, 0, TAU);
    }
  }

  function drawBackground() {
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, GROUND_Y);

    ctx.beginPath();
    forTiles(cloudOff, CLOUD_TW, addClouds);
    ctx.rect(0, CLOUD_BASE, W, GROUND_Y - CLOUD_BASE);
    ctx.fillStyle = '#e9f8f4';
    ctx.fill();

    ctx.beginPath();
    forTiles(cityOff, CITY_TW, addBuildings);
    ctx.fillStyle = '#a6d9c4';
    ctx.fill();
    ctx.beginPath();
    forTiles(cityOff, CITY_TW, addWindows);
    ctx.fillStyle = '#cdeee2';
    ctx.fill();

    // A darker copy of the bushes shifted up 2px gives them a rim.
    ctx.save();
    ctx.translate(0, -2);
    ctx.beginPath();
    forTiles(bushOff, BUSH_TW, addBushes);
    ctx.fillStyle = '#55ad3a';
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    forTiles(bushOff, BUSH_TW, addBushes);
    ctx.rect(0, BUSH_BASE, W, GROUND_Y - BUSH_BASE);
    ctx.fillStyle = '#75cf4f';
    ctx.fill();
  }

  function drawPipes() {
    ctx.lineWidth = 2;
    ctx.strokeStyle = OUTLINE;
    for (const p of pipes) {
      const top = p.gapTop;
      const bottom = top + PIPE_GAP;
      ctx.save();
      ctx.translate(p.x, 0);
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(0, -4, PIPE_W, top - CAP_H + 4);
      ctx.strokeRect(0, -4, PIPE_W, top - CAP_H + 4);
      ctx.fillRect(0, bottom + CAP_H, PIPE_W, GROUND_Y - bottom - CAP_H + 4);
      ctx.strokeRect(0, bottom + CAP_H, PIPE_W, GROUND_Y - bottom - CAP_H + 4);
      ctx.fillStyle = capGrad;
      ctx.fillRect(-CAP_OVER, top - CAP_H, PIPE_W + CAP_OVER * 2, CAP_H);
      ctx.strokeRect(-CAP_OVER, top - CAP_H, PIPE_W + CAP_OVER * 2, CAP_H);
      ctx.fillRect(-CAP_OVER, bottom, PIPE_W + CAP_OVER * 2, CAP_H);
      ctx.strokeRect(-CAP_OVER, bottom, PIPE_W + CAP_OVER * 2, CAP_H);
      ctx.restore();
    }
  }

  function drawGround() {
    const band = 16;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = '#9ee35f';
    ctx.fillRect(0, GROUND_Y, W, band);
    ctx.beginPath();
    for (let x = -groundOff - STRIPE - band; x < W + STRIPE; x += STRIPE) {
      ctx.moveTo(x, GROUND_Y + band);
      ctx.lineTo(x + STRIPE / 2, GROUND_Y + band);
      ctx.lineTo(x + STRIPE / 2 + band, GROUND_Y);
      ctx.lineTo(x + band, GROUND_Y);
      ctx.closePath();
    }
    ctx.fillStyle = '#76c13a';
    ctx.fill();
    ctx.fillStyle = OUTLINE;
    ctx.fillRect(0, GROUND_Y - 1, W, 2);
    ctx.fillStyle = '#5d9a2d';
    ctx.fillRect(0, GROUND_Y + band, W, 3);
    ctx.fillStyle = '#cfc581';
    ctx.fillRect(0, GROUND_Y + band + 3, W, 3);
  }

  const WING = [
    { x: -7, y: -4.5, r: 0.6 },      // up
    { x: -8, y: 0.5, r: 0 },         // level
    { x: -7, y: 5, r: -0.6 },        // down
  ];
  const WING_SEQ = [0, 1, 2, 1];

  function drawBird() {
    const frame = state === 'over' ? 1
      : WING_SEQ[Math.floor(bird.anim * (state === 'ready' ? 8 : 14)) % 4];
    const wing = WING[frame];

    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);
    ctx.scale(BIRD_SCALE, BIRD_SCALE);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = OUTLINE;

    // body
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 12, 0, 0, TAU);
    ctx.fillStyle = '#f8c935';
    ctx.fill();
    ctx.stroke();

    // belly
    ctx.beginPath();
    ctx.ellipse(1, 5, 10, 5.5, 0, 0, TAU);
    ctx.fillStyle = '#fbe6a2';
    ctx.fill();

    // eye
    ctx.beginPath();
    ctx.arc(7, -4.5, 5.5, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(9, -4.5, 1.9, 2.7, 0, 0, TAU);
    ctx.fillStyle = '#1e1416';
    ctx.fill();

    // beak
    roundRectPath(5, -0.5, 16.5, 4.8, 2.4);
    ctx.fillStyle = '#f57e2c';
    ctx.fill();
    ctx.stroke();
    roundRectPath(5, 4.3, 14, 4.4, 2.2);
    ctx.fillStyle = '#e3541f';
    ctx.fill();
    ctx.stroke();

    // wing
    ctx.beginPath();
    ctx.ellipse(wing.x, wing.y, 7.5, 4.6, wing.r, 0, TAU);
    ctx.fillStyle = '#fdf4d6';
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawScore() {
    const s = 1 + scorePop * 0.3;
    ctx.save();
    ctx.translate(W / 2, 72);
    ctx.scale(s, s);
    drawText(String(score), 0, 0, 54, '#fff', 8);
    ctx.restore();
  }

  function drawReady() {
    drawText('Flappy Bird', W / 2, 120, 48, '#fff', 8);
    drawText('Get Ready!', W / 2, 182, 30, '#86e04f', 6);
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 4);
    drawText('Click, tap or Space to flap', W / 2, 386, 20, '#fff', 5);
    ctx.globalAlpha = 1;
    if (best > 0) drawText('Best: ' + best, W / 2, 424, 18, '#ffe07a', 5);
  }

  function drawGameOver() {
    const t = Math.min(1, overTime / 0.45);
    const e = 1 - (1 - t) * (1 - t) * (1 - t);   // ease-out cubic
    ctx.save();
    ctx.globalAlpha = e;
    drawText('Game Over', W / 2, 160 - (1 - e) * 30, 46, '#ffab40', 8);

    const pw = 240, ph = 132;
    const px = (W - pw) / 2, py = 210 + (1 - e) * 60;
    roundRectPath(px, py, pw, ph, 12);
    ctx.fillStyle = '#ded895';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    roundRectPath(px + 6, py + 6, pw - 12, ph - 12, 8);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#c8b970';
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W / 2, py + 22);
    ctx.lineTo(W / 2, py + ph - 22);
    ctx.stroke();

    const lx = W / 2 - 60, rx = W / 2 + 60;
    ctx.font = 'bold 16px ' + FONT;
    ctx.fillStyle = '#e0702a';
    ctx.fillText('SCORE', lx, py + 30);
    ctx.fillText('BEST', rx, py + 30);
    drawText(String(score), lx, py + 72, 40, '#fff', 6);
    drawText(String(best), rx, py + 72, 40, '#fff', 6);
    if (newBest) {
      roundRectPath(rx - 24, py + 98, 48, 20, 10);
      ctx.fillStyle = '#e8412c';
      ctx.fill();
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillStyle = '#fff';
      ctx.fillText('NEW', rx, py + 108.5);
    }
    ctx.restore();

    if (overTime >= RESTART_DELAY) {
      ctx.globalAlpha = 0.65 + 0.35 * Math.sin(time * 5);
      drawText('Click, tap or Space to restart', W / 2, 390, 18, '#fff', 5);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.lineJoin = 'round';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    drawBackground();
    drawPipes();
    drawGround();
    drawBird();

    if (state === 'ready') drawReady();
    else if (state === 'playing' || !grounded) drawScore();
    else drawGameOver();

    if (flash > 0) {
      ctx.globalAlpha = flash;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Main loop: variable frame time, fixed-size physics sub-steps ----------
  let lastTime = 0;
  function frame(now) {
    let dt = lastTime ? Math.min(0.1, Math.max(0, (now - lastTime) / 1000)) : 0;
    lastTime = now;
    while (dt > 1e-6) {
      const step = Math.min(dt, MAX_STEP);
      update(step);
      dt -= step;
    }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Input: Space, mouse click, touch ----------
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
      e.preventDefault();               // keep the page from scrolling
      if (!e.repeat) press();           // holding Space does not auto-flap
    }
  });

  if (window.PointerEvent) {
    window.addEventListener('pointerdown', (e) => {
      if (e.button === 0) press();      // left mouse button, touch contact or pen tip
    });
  } else {
    window.addEventListener('touchstart', (e) => {
      e.preventDefault();               // suppress the emulated mousedown
      press();
    }, { passive: false });
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) press();
    });
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
