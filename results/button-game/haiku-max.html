<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #1b1c28;
      color: #f2f2f7;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .hud {
      display: flex;
      gap: 36px;
      font-size: 1.2rem;
      font-variant-numeric: tabular-nums;
    }

    .hud strong {
      font-size: 1.5rem;
    }

    .field {
      position: relative;
      width: min(92vw, 640px);
      height: min(60vh, 420px);
      overflow: hidden;
      border: 2px solid #3a3d57;
      border-radius: 14px;
      background: #252738;
    }

    .target {
      position: absolute;
      top: 0;
      left: 0;
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      background: #ff5c7a;
      color: #fff;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .target:hover {
      background: #ff4469;
    }

    .overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: rgba(27, 28, 40, 0.92);
    }

    .overlay p {
      margin: 0;
      max-width: 28ch;
      font-size: 1.15rem;
      line-height: 1.4;
    }

    .btn {
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 12px 36px;
      border: none;
      border-radius: 10px;
      background: #4f8cff;
      color: #fff;
      cursor: pointer;
    }

    .btn:hover {
      background: #3d7af0;
    }

    .btn:focus-visible,
    .target:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <h1>Button Game</h1>
  <div class="hud">
    <div>Score: <strong id="score">0</strong></div>
    <div>Time left: <strong id="time">30</strong>s</div>
  </div>
  <div class="field" id="field">
    <button class="target" id="target" type="button" hidden>Click me!</button>
    <div class="overlay" id="overlay">
      <p id="message" aria-live="polite">Click the target as many times as you can in 30 seconds.</p>
      <button class="btn" id="start-btn" type="button">Start</button>
      <button class="btn" id="again-btn" type="button" hidden>Play again</button>
    </div>
  </div>
  <script>
    (() => {
      'use strict';

      const ROUND_SECONDS = 30;
      const ROUND_MS = ROUND_SECONDS * 1000;
      const TICK_MS = 100;

      const field = document.getElementById('field');
      const target = document.getElementById('target');
      const overlay = document.getElementById('overlay');
      const message = document.getElementById('message');
      const startBtn = document.getElementById('start-btn');
      const againBtn = document.getElementById('again-btn');
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');

      let running = false;
      let score = 0;
      let endAt = 0;
      let timerId = null;
      let pos = null; // current target top-left in field pixels: {x, y}

      function placeTarget(x, y) {
        pos = { x, y };
        target.style.left = `${x}px`;
        target.style.top = `${y}px`;
      }

      // Only valid while the target is displayed (offsetWidth/offsetHeight are 0 when hidden).
      function maxPos() {
        return {
          x: Math.max(0, field.clientWidth - target.offsetWidth),
          y: Math.max(0, field.clientHeight - target.offsetHeight),
        };
      }

      // Random spot inside the field. Retries (bounded) until it is at least a third of the
      // field's short side away from the previous spot, so every click visibly moves the target.
      function jumpTarget() {
        const max = maxPos();
        const minJump = Math.min(field.clientWidth, field.clientHeight) / 3;
        let x = 0;
        let y = 0;
        for (let attempt = 0; attempt < 50; attempt++) {
          x = Math.random() * max.x;
          y = Math.random() * max.y;
          if (!pos || Math.hypot(x - pos.x, y - pos.y) >= minJump) break;
        }
        placeTarget(x, y);
      }

      function tick() {
        const remaining = endAt - Date.now();
        if (remaining <= 0) {
          endRound();
        } else {
          timeEl.textContent = String(Math.ceil(remaining / 1000));
        }
      }

      function startRound() {
        clearInterval(timerId);
        running = true;
        score = 0;
        pos = null;
        scoreEl.textContent = '0';
        timeEl.textContent = String(ROUND_SECONDS);
        endAt = Date.now() + ROUND_MS;
        overlay.hidden = true;
        target.hidden = false;
        jumpTarget();
        timerId = setInterval(tick, TICK_MS);
      }

      function endRound() {
        clearInterval(timerId);
        timerId = null;
        running = false;
        target.hidden = true;
        timeEl.textContent = '0';
        message.textContent = `Time's up! Final score: ${score}`;
        startBtn.hidden = true;
        againBtn.hidden = false;
        overlay.hidden = false;
      }

      target.addEventListener('click', () => {
        if (!running) return;
        score += 1;
        scoreEl.textContent = String(score);
        jumpTarget();
      });

      // Keep the target inside the field if the viewport changes mid-round.
      window.addEventListener('resize', () => {
        if (!running) return;
        const max = maxPos();
        placeTarget(Math.min(pos.x, max.x), Math.min(pos.y, max.y));
      });

      startBtn.addEventListener('click', startRound);
      againBtn.addEventListener('click', startRound);
    })();
  </script>
</body>
</html>
