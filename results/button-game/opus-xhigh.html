<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button Game</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e2233;
    color: #f2f4f8;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #151827;
    font-size: 1.25rem;
    font-weight: 600;
  }
  #arena {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  #target {
    position: absolute;
    left: 0;
    top: 0;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: #ff4d6d;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  #target:active { transform: scale(0.92); }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    text-align: center;
  }
  #message { margin: 0; font-size: 1.5rem; }
  #startBtn {
    padding: 14px 36px;
    font-size: 1.4rem;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #3ddc97;
    color: #10301f;
    cursor: pointer;
  }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <span>Score: <span id="score">0</span></span>
    <span>Time: <span id="time">30</span>s</span>
  </header>
  <main id="arena">
    <button id="target" type="button" aria-label="Target" hidden>Click!</button>
    <div id="overlay">
      <p id="message" aria-live="polite">Click the target as many times as you can in 30 seconds.</p>
      <button id="startBtn" type="button">Start</button>
    </div>
  </main>

<script>
  const ROUND_SECONDS = 30;

  const arena = document.getElementById('arena');
  const target = document.getElementById('target');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');

  let score = 0;
  let endTime = 0;
  let timerId = null;
  let running = false;

  function bounds() {
    return {
      maxX: Math.max(0, arena.clientWidth - target.offsetWidth),
      maxY: Math.max(0, arena.clientHeight - target.offsetHeight)
    };
  }

  // Move the target to a random spot inside the arena, preferring one
  // clearly away from where it currently is so the jump is visible.
  function moveTarget() {
    const { maxX, maxY } = bounds();
    const oldX = target.offsetLeft;
    const oldY = target.offsetTop;
    let x = 0, y = 0;
    for (let i = 0; i < 10; i++) {
      x = Math.round(Math.random() * maxX);
      y = Math.round(Math.random() * maxY);
      if (Math.hypot(x - oldX, y - oldY) >= target.offsetWidth) break;
    }
    target.style.left = x + 'px';
    target.style.top = y + 'px';
  }

  function startRound() {
    score = 0;
    scoreEl.textContent = score;
    timeEl.textContent = ROUND_SECONDS;
    endTime = performance.now() + ROUND_SECONDS * 1000;
    running = true;
    overlay.hidden = true;
    target.hidden = false;
    moveTarget();
    timerId = setInterval(tick, 100);
  }

  function tick() {
    const remaining = endTime - performance.now();
    if (remaining <= 0) {
      endRound();
      return;
    }
    timeEl.textContent = Math.ceil(remaining / 1000);
  }

  function endRound() {
    running = false;
    clearInterval(timerId);
    timerId = null;
    timeEl.textContent = 0;
    target.hidden = true;
    message.textContent = "Time's up! Final score: " + score;
    startBtn.textContent = 'Play again';
    // Briefly disable so a rapid click meant for the target can't restart instantly.
    startBtn.disabled = true;
    overlay.hidden = false;
    setTimeout(() => {
      startBtn.disabled = false;
      startBtn.focus();
    }, 800);
  }

  target.addEventListener('click', () => {
    if (!running) return;
    if (performance.now() >= endTime) {
      endRound();
      return;
    }
    score++;
    scoreEl.textContent = score;
    moveTarget();
  });

  startBtn.addEventListener('click', startRound);

  // Keep the target inside the arena if the window is resized mid-round.
  window.addEventListener('resize', () => {
    if (!running) return;
    const { maxX, maxY } = bounds();
    target.style.left = Math.min(target.offsetLeft, maxX) + 'px';
    target.style.top = Math.min(target.offsetTop, maxY) + 'px';
  });
</script>
</body>
</html>
