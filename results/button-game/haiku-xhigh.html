<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Game</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1e1e2e;
    color: #f0f0f0;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 2rem;
  }

  .hud {
    display: flex;
    gap: 32px;
    font-size: 1.25rem;
    margin-bottom: 12px;
  }

  #playArea {
    position: relative;
    width: min(640px, 92vw);
    height: 380px;
    background: #2a2a3d;
    border-radius: 12px;
    overflow: hidden;
  }

  .target {
    position: absolute;
    width: 110px;
    height: 56px;
    border: none;
    border-radius: 10px;
    background: #ff6b6b;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }

  .target:active {
    transform: scale(0.95);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }

  .overlay p {
    margin: 0;
    font-size: 1.5rem;
  }

  .action {
    padding: 12px 28px;
    font-size: 1.2rem;
    border: none;
    border-radius: 8px;
    background: #4ecdc4;
    color: #10202a;
    cursor: pointer;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>
  <h1>Button Game</h1>

  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Time left: <span id="time">30</span>s</div>
  </div>

  <div id="playArea">
    <button id="target" class="target hidden">Click me!</button>

    <div id="overlay" class="overlay">
      <p id="message">Click Start to begin</p>
      <button id="actionBtn" class="action">Start</button>
    </div>
  </div>

<script>
  const DURATION_MS = 30000;

  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const playArea = document.getElementById('playArea');
  const target = document.getElementById('target');
  const overlay = document.getElementById('overlay');
  const message = document.getElementById('message');
  const actionBtn = document.getElementById('actionBtn');

  let score = 0;
  let endTime = 0;
  let timerId = null;
  let running = false;

  function setTimeLeft(ms) {
    timeEl.textContent = Math.max(0, Math.ceil(ms / 1000));
  }

  function moveTarget() {
    const maxX = Math.max(0, playArea.clientWidth - target.offsetWidth);
    const maxY = Math.max(0, playArea.clientHeight - target.offsetHeight);
    target.style.left = Math.floor(Math.random() * (maxX + 1)) + 'px';
    target.style.top = Math.floor(Math.random() * (maxY + 1)) + 'px';
  }

  function tick() {
    const remaining = endTime - performance.now();
    if (remaining <= 0) {
      endRound();
    } else {
      setTimeLeft(remaining);
    }
  }

  function startRound() {
    score = 0;
    scoreEl.textContent = score;
    setTimeLeft(DURATION_MS);

    overlay.classList.add('hidden');
    target.classList.remove('hidden');
    moveTarget();

    running = true;
    endTime = performance.now() + DURATION_MS;
    timerId = setInterval(tick, 100);
  }

  function endRound() {
    running = false;
    clearInterval(timerId);
    timerId = null;

    target.classList.add('hidden');
    setTimeLeft(0);

    message.textContent = `Time's up! Final score: ${score}`;
    actionBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  target.addEventListener('click', () => {
    if (!running) return;
    score += 1;
    scoreEl.textContent = score;
    moveTarget();
  });

  actionBtn.addEventListener('click', startRound);
</script>
</body>
</html>
