<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1e2233;
    color: #f2f2f2;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 14px;
    font-size: 1.4rem;
    background: #151827;
    user-select: none;
  }
  #arena {
    position: relative;
    flex: 1;
    overflow: hidden;
  }
  .panel {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  .panel h1 { margin: 0; font-size: 2.2rem; }
  .panel p { margin: 0; font-size: 1.2rem; }
  .big {
    font-size: 1.3rem;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: #4caf50;
    color: #fff;
    cursor: pointer;
  }
  .big:hover { background: #43a047; }
  #target {
    position: absolute;
    width: 70px;
    height: 70px;
    border: none;
    border-radius: 50%;
    background: #ff5252;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #target:active { transform: scale(0.92); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div>Score: <span id="score">0</span></div>
  <div>Time: <span id="time">30</span>s</div>
</header>
<div id="arena">
  <div id="startPanel" class="panel">
    <h1>Button Game</h1>
    <p>Click the target as many times as you can in 30 seconds.</p>
    <button id="startBtn" class="big">Start</button>
  </div>
  <div id="endPanel" class="panel hidden">
    <h1>Time's up!</h1>
    <p>Final score: <strong id="finalScore">0</strong></p>
    <button id="againBtn" class="big">Play again</button>
  </div>
  <button id="target" class="hidden">Click!</button>
</div>
<script>
  const ROUND_SECONDS = 30;
  const arena = document.getElementById('arena');
  const target = document.getElementById('target');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const finalScoreEl = document.getElementById('finalScore');
  const startPanel = document.getElementById('startPanel');
  const endPanel = document.getElementById('endPanel');

  let score = 0;
  let endTime = 0;
  let timerId = null;

  function moveTarget() {
    const maxX = Math.max(0, arena.clientWidth - target.offsetWidth);
    const maxY = Math.max(0, arena.clientHeight - target.offsetHeight);
    target.style.left = Math.floor(Math.random() * (maxX + 1)) + 'px';
    target.style.top = Math.floor(Math.random() * (maxY + 1)) + 'px';
  }

  function updateTime() {
    const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    timeEl.textContent = remaining;
    if (remaining <= 0) endRound();
  }

  function startRound() {
    score = 0;
    scoreEl.textContent = score;
    timeEl.textContent = ROUND_SECONDS;
    startPanel.classList.add('hidden');
    endPanel.classList.add('hidden');
    target.classList.remove('hidden');
    moveTarget();
    endTime = Date.now() + ROUND_SECONDS * 1000;
    clearInterval(timerId);
    timerId = setInterval(updateTime, 100);
  }

  function endRound() {
    clearInterval(timerId);
    timerId = null;
    target.classList.add('hidden');
    finalScoreEl.textContent = score;
    endPanel.classList.remove('hidden');
  }

  target.addEventListener('click', () => {
    if (timerId === null) return;
    score++;
    scoreEl.textContent = score;
    moveTarget();
  });

  document.getElementById('startBtn').addEventListener('click', startRound);
  document.getElementById('againBtn').addEventListener('click', startRound);
</script>
</body>
</html>
