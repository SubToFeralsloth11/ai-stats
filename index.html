<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Stats</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #2a2f3a; --fg: #e6e8ee;
    --muted: #8a91a0; --accent: #d97757;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  nav button {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 16px; font: inherit; cursor: pointer;
  }
  nav button:hover { color: var(--fg); }
  nav button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .desc { color: var(--muted); margin: 12px 0 20px; }
  section {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  td.level { font-weight: 600; text-transform: capitalize; }
  td.empty { color: var(--muted); }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>AI Stats</h1>
  <p class="sub">Model comparison by effort level.</p>
  <nav id="tabs" role="tablist"></nav>
  <p class="desc" id="desc"></p>
  <div id="models"></div>
  <footer>Empty cells show "—" until data is added.</footer>
</main>

<script>
  // ===== EDIT DATA HERE =====
  // Each tab has its own columns and its own data.
  // Fill in a row in the same order as that tab's columns. Leave a value as null to show "—".
  // In the "Result" column, put a link (e.g. "results/flappy-bird/opus-high.html"
  // or any https:// URL) and it becomes a clickable "View result" link.

  // Effort levels shown for each model. Nemotron 3 Free Ultra only supports medium and high.
  const ALL_LEVELS = ["low", "medium", "high", "xhigh", "max"];
  const MODELS = [
    { name: "Claude Opus 5.5", levels: ALL_LEVELS },
    { name: "Claude Haiku 5.5", levels: ALL_LEVELS },
    { name: "Nemotron 3 Free Ultra", levels: ["medium", "high"] },
  ];

  const BUILD_COLUMNS = ["Time to build", "Worked first try?", "Fix attempts", "Tokens used", "Cost ($)", "Quality (1-10)", "Result"];

  const TABS = [
    {
      id: "general",
      title: "General stats",
      description: "Score = average Quality of that model's Flappy Bird and Button game builds (1-10). Speed, time to first token and reply time are medians of 5 omp bench chat runs, one at a time. Cost is the list price per 1M tokens.",
      columns: ["Score", "Speed (tok/s)", "Time to first token (s)", "Cost ($/1M tokens)", "Notes"],
      data: {
        "Claude Opus 5.5": {
          low: [6.5, 89, 0.92, "$4 in / $20 out", "Median reply: 22s"],
          medium: [7.5, 90, 0.93, "$4 in / $20 out", "Median reply: 30s"],
          high: [8.0, 96, 0.92, "$4 in / $20 out", "Median reply: 31s"],
          xhigh: [8.0, 95, 0.93, "$4 in / $20 out", "Median reply: 40s"],
          max: [9.0, 100, 0.99, "$4 in / $20 out", "Median reply: 5m 32s"],
        },
        "Claude Haiku 5.5": {
          low: [5.5, 164, 0.65, "$0.10 in / $0.50 out", "Median reply: 8s"],
          medium: [5.5, 176, 0.73, "$0.10 in / $0.50 out", "Median reply: 10s"],
          high: [7.0, 185, 0.67, "$0.10 in / $0.50 out", "Median reply: 11s"],
          xhigh: [7.0, 197, 0.57, "$0.10 in / $0.50 out", "Median reply: 20s"],
          max: [6.5, 226, 0.64, "$0.10 in / $0.50 out", "Median reply: 2m 27s"],
        },
        "Nemotron 3 Free Ultra": {
          medium: [4.5, 32, 0.83, "Free", "Median reply: 16s; OpenRouter free tier"],
          high: [3.5, 38, 0.83, "Free", "Median reply: 14s; OpenRouter free tier"],
        },
      },
    },
    {
      id: "flappy-bird",
      title: "Flappy Bird",
      description: "Same prompt for every model: build a working Flappy Bird clone in one HTML file. Time, tokens and cost include any fix attempts. Quality is my 1-10 rating after playing it.",
      columns: BUILD_COLUMNS,
      data: {
        "Claude Opus 5.5": {
          low: ["29s", "Yes", 0, "21,049", "0.14", 6, "results/flappy-bird/opus-low.html"],
          medium: ["48s", "Yes", 0, "25,687", "0.21", 8, "results/flappy-bird/opus-medium.html"],
          high: ["1m 36s", "Yes", 0, "37,523", "0.33", 8, "results/flappy-bird/opus-high.html"],
          xhigh: ["7m 12s", "Yes", 0, "317,529", "1.39", 9, "results/flappy-bird/opus-xhigh.html"],
          max: ["14m 45s", "Yes", 0, "304,701", "2.77", 9, "results/flappy-bird/opus-max.html"],
        },
        "Claude Haiku 5.5": {
          low: ["18s", "Yes", 0, "22,796", "0.0044", 5, "results/flappy-bird/haiku-low.html"],
          medium: ["52s", "Yes", 0, "38,516", "0.0089", 6, "results/flappy-bird/haiku-medium.html"],
          high: ["1m 36s", "Yes", 0, "59,260", "0.02", 7, "results/flappy-bird/haiku-high.html"],
          xhigh: ["2m 01s", "Yes", 0, "69,718", "0.02", 7, "results/flappy-bird/haiku-xhigh.html"],
          max: ["4m 52s", "Yes", 0, "156,702", "0.05", 6, "results/flappy-bird/haiku-max.html"],
        },
        "Nemotron 3 Free Ultra": {
          medium: ["1m 28s", "No", 1, "85,554", "Free", 4, "results/flappy-bird/nemotron-medium.html"],
          high: ["56s", "Yes", 0, "19,340", "Free", 3, "results/flappy-bird/nemotron-high.html"],
        },
      },
    },
    {
      id: "button-game",
      title: "Button game",
      description: "Same prompt for every model: build a 30-second click-the-moving-button game in one HTML file. Time, tokens and cost include any fix attempts. Quality is my 1-10 rating after playing it.",
      columns: BUILD_COLUMNS,
      data: {
        "Claude Opus 5.5": {
          low: ["18s", "Yes", 0, "16,531", "0.05", 7, "results/button-game/opus-low.html"],
          medium: ["23s", "Yes", 0, "18,303", "0.07", 7, "results/button-game/opus-medium.html"],
          high: ["28s", "Yes", 0, "18,893", "0.08", 8, "results/button-game/opus-high.html"],
          xhigh: ["56s", "Yes", 0, "34,704", "0.16", 7, "results/button-game/opus-xhigh.html"],
          max: ["6m 43s", "Yes", 0, "147,298", "1.23", 9, "results/button-game/opus-max.html"],
        },
        "Claude Haiku 5.5": {
          low: ["9s", "Yes", 0, "17,054", "0.0015", 6, "results/button-game/haiku-low.html"],
          medium: ["14s", "Yes", 0, "19,915", "0.0025", 5, "results/button-game/haiku-medium.html"],
          high: ["26s", "Yes", 0, "24,615", "0.0042", 7, "results/button-game/haiku-high.html"],
          xhigh: ["27s", "Yes", 0, "24,754", "0.0042", 7, "results/button-game/haiku-xhigh.html"],
          max: ["2m 21s", "Yes", 0, "113,115", "0.02", 7, "results/button-game/haiku-max.html"],
        },
        "Nemotron 3 Free Ultra": {
          medium: ["25s", "Yes", 0, "12,487", "Free", 5, "results/button-game/nemotron-medium.html"],
          high: ["1m 48s", "No", 1, "66,591", "Free", 4, "results/button-game/nemotron-high.html"],
        },
      },
    },
  ];
  // Example of a filled row on the Flappy Bird tab:
  //   high: ["4m 12s", "Yes", 0, 18000, 0.27, 8, "results/flappy-bird/opus-high.html"],
  // ===== END DATA =====

  const tabsEl = document.getElementById("tabs");
  const descEl = document.getElementById("desc");
  const modelsEl = document.getElementById("models");

  const isLink = (v) => typeof v === "string" && /^(https?:\/\/|results\/|\.{0,2}\/)/.test(v);

  function renderCell(cell, value) {
    if (value === null || value === undefined || value === "") {
      cell.textContent = "—";
      cell.className = "empty";
    } else if (isLink(value)) {
      const a = document.createElement("a");
      a.href = value;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "View result";
      cell.appendChild(a);
    } else {
      cell.textContent = value;
    }
  }

  function renderTab(tab) {
    descEl.textContent = tab.description;
    modelsEl.replaceChildren();
    for (const { name, levels } of MODELS) {
      const section = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = name;
      section.appendChild(h2);

      const scroll = document.createElement("div");
      scroll.className = "scroll";
      const table = document.createElement("table");
      const headRow = table.createTHead().insertRow();
      for (const label of ["Effort", ...tab.columns]) {
        const th = document.createElement("th");
        th.textContent = label;
        headRow.appendChild(th);
      }

      const body = table.createTBody();
      const modelData = tab.data[name] || {};
      for (const level of levels) {
        const row = body.insertRow();
        const levelCell = row.insertCell();
        levelCell.className = "level";
        levelCell.textContent = level;
        const values = modelData[level] || [];
        tab.columns.forEach((_, i) => renderCell(row.insertCell(), values[i]));
      }

      scroll.appendChild(table);
      section.appendChild(scroll);
      modelsEl.appendChild(section);
    }
    for (const btn of tabsEl.children) {
      btn.setAttribute("aria-selected", String(btn.dataset.id === tab.id));
    }
  }

  function showFromHash() {
    const id = location.hash.slice(1);
    renderTab(TABS.find((t) => t.id === id) || TABS[0]);
  }

  for (const tab of TABS) {
    const btn = document.createElement("button");
    btn.role = "tab";
    btn.dataset.id = tab.id;
    btn.textContent = tab.title;
    btn.addEventListener("click", () => { location.hash = tab.id; });
    tabsEl.appendChild(btn);
  }
  window.addEventListener("hashchange", showFromHash);
  showFromHash();
</script>
</body>
</html>
