<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Stats</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #2a2f3a; --fg: #e6e8ee;
    --muted: #8a91a0; --accent: #d97757;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  section {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px;
  }
  h2 { margin: 0 0 14px; font-size: 20px; }
  h2 span { color: var(--accent); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }
  td.level { font-weight: 600; text-transform: capitalize; }
  td.empty { color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>AI Stats</h1>
  <p class="sub">Model comparison by effort level.</p>
  <div id="models"></div>
  <footer>Empty cells show "—" until data is added.</footer>
</main>

<script>
  // ===== EDIT DATA HERE =====
  // Fill in any value below. Leave it as null to show "—".
  const COLUMNS = ["Score", "Speed (tok/s)", "Time to first token (s)", "Cost ($/1M tokens)", "Notes"];

  const LEVELS = ["low", "medium", "high", "xhigh", "max"];

  const emptyRow = () => COLUMNS.map(() => null);

  const MODELS = [
    {
      name: "Claude Opus 5.5",
      data: {
        low:    emptyRow(),
        medium: emptyRow(),
        high:   emptyRow(),
        xhigh:  emptyRow(),
        max:    emptyRow(),
      },
    },
    {
      name: "Claude Haiku 5.5",
      data: {
        low:    emptyRow(),
        medium: emptyRow(),
        high:   emptyRow(),
        xhigh:  emptyRow(),
        max:    emptyRow(),
      },
    },
    {
      name: "Nemotron 3 Free Ultra",
      data: {
        low:    emptyRow(),
        medium: emptyRow(),
        high:   emptyRow(),
        xhigh:  emptyRow(),
        max:    emptyRow(),
      },
    },
  ];
  // Example of filled data:  high: [92, 45, 1.2, 15, "Best overall"],
  // ===== END DATA =====

  const root = document.getElementById("models");
  for (const model of MODELS) {
    const section = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = model.name;
    section.appendChild(h2);

    const scroll = document.createElement("div");
    scroll.className = "scroll";
    const table = document.createElement("table");
    const headRow = table.createTHead().insertRow();
    for (const label of ["Effort", ...COLUMNS]) {
      const th = document.createElement("th");
      th.textContent = label;
      headRow.appendChild(th);
    }

    const body = table.createTBody();
    for (const level of LEVELS) {
      const row = body.insertRow();
      const levelCell = row.insertCell();
      levelCell.className = "level";
      levelCell.textContent = level;
      const values = model.data[level] || emptyRow();
      COLUMNS.forEach((_, i) => {
        const cell = row.insertCell();
        const v = values[i];
        if (v === null || v === undefined || v === "") {
          cell.textContent = "—";
          cell.className = "empty";
        } else {
          cell.textContent = v;
        }
      });
    }

    scroll.appendChild(table);
    section.appendChild(scroll);
    root.appendChild(section);
  }
</script>
</body>
</html>
